<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知识库目录</title>
  <link rel="stylesheet" href="../tokens.css" />
  <style>
    /* Hallmark · macrostructure: Editorial Directory · genre: modern-minimal · designed-as-static */
    html, body { overflow-x: clip; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-body);
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; }
    .shell {
      width: min(100% - var(--space-lg), 72rem);
      margin-inline: auto;
      padding-block: var(--space-xl) var(--space-lg);
    }
    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(17.5rem, 0.62fr);
      gap: var(--space-lg);
      align-items: end;
      padding-bottom: var(--space-xl);
      border-bottom: var(--rule-thin) solid var(--color-rule);
    }
    .label {
      margin: 0 0 var(--space-sm);
      color: var(--color-accent);
      font-family: var(--font-outlier);
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    h1, h2, h3 {
      margin: 0;
      font-family: var(--font-display);
      font-style: normal;
      color: var(--color-ink);
      overflow-wrap: anywhere;
      min-width: 0;
    }
    h1 {
      max-width: 11ch;
      font-size: var(--text-2xl);
      line-height: 0.98;
      letter-spacing: -0.045em;
    }
    .lede {
      max-width: 58ch;
      margin: var(--space-md) 0 0;
      color: var(--color-ink-2);
      font-size: var(--text-md);
      line-height: 1.75;
    }
    .status-panel {
      display: grid;
      gap: var(--space-sm);
      padding: var(--space-md);
      border: var(--rule-thin) solid var(--color-rule);
      border-radius: var(--radius-card);
      background: var(--color-panel);
      box-shadow: var(--shadow-card);
    }
    .status-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-sm);
      padding-bottom: var(--space-sm);
      border-bottom: var(--rule-thin) solid var(--color-rule);
    }
    .status-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .status-total { display: block; padding-bottom: var(--space-sm); }
    .status-total strong { font-size: clamp(4rem, 8vw, 7rem); }
    .status-total span { display: block; margin-top: var(--space-xs); text-align: left; color: var(--color-ink-2); font-size: var(--text-md); }
    .status-note { margin: 0; color: var(--color-muted); line-height: 1.7; }
    .status-row strong {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      line-height: 1;
    }
    .status-row span {
      color: var(--color-muted);
      font-size: var(--text-sm);
      text-align: right;
    }
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-xs);
      align-items: center;
      margin-top: var(--space-lg);
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding-inline: var(--space-md);
      border: var(--rule-thin) solid var(--color-rule);
      border-radius: var(--radius-pill);
      background: var(--color-panel);
      color: var(--color-ink);
      font-weight: 750;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      outline: 2px solid transparent;
      outline-offset: 2px;
      transition: transform var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
    }
    .button.primary {
      border-color: var(--color-accent);
      background: var(--color-accent);
      color: var(--color-accent-ink);
    }
    .button:hover { transform: translateY(-1px); border-color: var(--color-accent); }
    .button:active { transform: translateY(0); }
    .button:focus-visible { outline-color: var(--color-focus); }
    .button[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
    .directory {
      margin-top: var(--space-xl);
      display: grid;
      gap: var(--space-sm);
    }
    .section-head {
      display: block;
      margin-bottom: var(--space-xs);
    }
    h2 { font-size: var(--text-xl); line-height: 1.1; letter-spacing: -0.025em; }
    .section-note { margin: var(--space-xs) 0 0; color: var(--color-muted); line-height: 1.7; max-width: 62ch; }
    .kb-list {
      display: grid;
      gap: var(--space-sm);
    }
    .kb-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-md);
      align-items: center;
      padding: var(--space-md);
      border: var(--rule-thin) solid var(--color-rule);
      border-radius: var(--radius-card);
      background: var(--color-panel);
      text-decoration: none;
      outline: 2px solid transparent;
      outline-offset: 2px;
      transition: transform var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out);
    }
    .kb-item:hover { transform: translateY(-2px); border-color: var(--color-accent); background: var(--color-panel-soft); }
    .kb-item:active { transform: translateY(0); }
    .kb-item:focus-visible { outline-color: var(--color-focus); }
    .kb-item.is-disabled { opacity: 0.62; pointer-events: none; }
    .kb-copy { min-width: 0; }
    .kb-copy h3 { font-size: var(--text-lg); line-height: 1.18; letter-spacing: -0.018em; }
    .kb-copy p { max-width: 65ch; margin: var(--space-xs) 0 0; color: var(--color-ink-2); line-height: 1.7; }
    .tags { display: flex; flex-wrap: wrap; gap: var(--space-2xs); margin-top: var(--space-sm); }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 1.75rem;
      padding-inline: var(--space-xs);
      border-radius: var(--radius-pill);
      background: var(--color-paper-2);
      color: var(--color-muted);
      font-family: var(--font-outlier);
      font-size: var(--text-xs);
      white-space: nowrap;
    }
    .availability {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2rem;
      padding-inline: var(--space-xs);
      border-radius: var(--radius-pill);
      font-size: var(--text-sm);
      font-weight: 800;
      white-space: nowrap;
    }
    .availability.ready { color: var(--color-green); background: var(--color-green-soft); }
    .availability.todo { color: var(--color-amber); background: var(--color-amber-soft); }
    .notes {
      margin-top: var(--space-xl);
      padding-top: var(--space-md);
      border-top: var(--rule-thin) solid var(--color-rule);
      display: flex;
      justify-content: space-between;
      gap: var(--space-md);
      color: var(--color-muted);
      font-size: var(--text-sm);
      line-height: 1.6;
    }
    .notes code { font-family: var(--font-outlier); color: var(--color-ink-2); }
    @media (max-width: 48rem) {
      .shell { width: min(100% - var(--space-md), 72rem); padding-block: var(--space-lg); }
      .masthead, .kb-item, .notes { grid-template-columns: minmax(0, 1fr); }
      .masthead { align-items: start; padding-bottom: var(--space-lg); }
      .kb-item { align-items: start; }
      .availability { width: fit-content; }
      .notes { display: grid; }
    }
    @media (max-width: 24rem) {
      .quick-actions { display: grid; align-items: stretch; }
      .button { width: 100%; padding-inline: var(--space-sm); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 50ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="label">Personal Archive</p>
        <h1>知识库目录</h1>
        <p class="lede">这里列出 knowledge-bases 目录下已经发布或待补全的主题。</p>
        <div class="quick-actions">
          <a class="button primary" href="chinese-history-5000-years/">阅读中国史</a>
          <a class="button" href="./">查看目录</a>
        </div>
      </div>
      <aside class="status-panel" aria-label="知识库总数">
        <div class="status-row status-total"><strong>1</strong><span>个知识库</span></div>
      </aside>
    </header>

    <section class="directory" aria-labelledby="directory-title">
      <header class="section-head">
        <h2 id="directory-title">知识库目录</h2>
        <p class="section-note">选择一个主题进入阅读。后续新增完成的知识库会继续出现在这里。</p>
      </header>
      <div class="kb-list">
        <a class="kb-item" href="chinese-history-5000-years/">
          <div class="kb-copy">
            <h3>中国上下五千年历史</h3>
            <p>面向普通读者的中国史脉络知识库，包含朝代演进、关键制度、人物事件和学习路径。</p>
            <div class="tags"><span class="tag">历史</span><span class="tag">多页面</span><span class="tag">内容清单</span></div>
          </div>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
