<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>提示词优化助手</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
					'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				min-height: 100vh;
				padding: 20px;
			}

			.container {
				max-width: 1400px;
				margin: 0 auto;
			}

			header {
				text-align: center;
				color: white;
				margin-bottom: 30px;
			}

			header h1 {
				font-size: 2.5em;
				margin-bottom: 10px;
				text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
			}

			header p {
				font-size: 1.1em;
				opacity: 0.9;
			}

			.main-content {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 20px;
				margin-bottom: 20px;
			}

			.panel {
				background: white;
				border-radius: 12px;
				padding: 25px;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
			}

			.panel-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 20px;
				padding-bottom: 15px;
				border-bottom: 2px solid #f0f0f0;
			}

			.panel-header h2 {
				color: #333;
				font-size: 1.3em;
			}

			.panel-header .icon {
				font-size: 1.5em;
			}

			textarea {
				width: 100%;
				min-height: 300px;
				padding: 15px;
				border: 2px solid #e0e0e0;
				border-radius: 8px;
				font-size: 14px;
				line-height: 1.6;
				resize: vertical;
				transition: border-color 0.3s;
				font-family: inherit;
			}

			textarea:focus {
				outline: none;
				border-color: #667eea;
			}

			.btn-group {
				display: flex;
				gap: 10px;
				margin-top: 15px;
			}

			button {
				flex: 1;
				padding: 12px 24px;
				border: none;
				border-radius: 8px;
				font-size: 14px;
				font-weight: 600;
				cursor: pointer;
				transition: all 0.3s;
			}

			.btn-primary {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
			}

			.btn-primary:hover {
				transform: translateY(-2px);
				box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
			}

			.btn-primary:disabled {
				background: #ccc;
				cursor: not-allowed;
				transform: none;
			}

			.btn-secondary {
				background: #f5f5f5;
				color: #666;
			}

			.btn-secondary:hover {
				background: #e0e0e0;
			}

			.output-content {
				min-height: 300px;
				padding: 20px;
				background: #f8f9fa;
				border-radius: 8px;
				overflow-y: auto;
				max-height: 600px;
			}

			.loading {
				text-align: center;
				padding: 40px;
				color: #666;
			}

			.loading-spinner {
				border: 3px solid #f3f3f3;
				border-top: 3px solid #667eea;
				border-radius: 50%;
				width: 40px;
				height: 40px;
				animation: spin 1s linear infinite;
				margin: 0 auto 15px;
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			.evaluation-item {
				margin-bottom: 20px;
				padding: 15px;
				background: white;
				border-radius: 8px;
				border-left: 4px solid #667eea;
			}

			.evaluation-item h3 {
				color: #333;
				margin-bottom: 8px;
				font-size: 1.1em;
			}

			.score {
				display: inline-block;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				padding: 4px 12px;
				border-radius: 20px;
				font-weight: 600;
				margin-left: 10px;
			}

			.evaluation-item p {
				color: #666;
				line-height: 1.6;
				margin-top: 8px;
			}

			.improved-prompt {
				background: #f0f9ff;
				border: 2px solid #0ea5e9;
				border-radius: 8px;
				padding: 20px;
				margin-top: 25px;
			}

			.improved-prompt h3 {
				color: #0369a1;
				font-size: 1.3em;
				margin-bottom: 15px;
			}

			.improved-prompt .prompt-text {
				background: white;
				padding: 18px;
				border-radius: 6px;
				margin-top: 10px;
				line-height: 1.8;
				color: #333;
				border: 1px solid #e0e0e0;
				font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
				font-size: 14px;
			}

			.copy-btn {
				margin-top: 10px;
				padding: 8px 16px;
				background: #4caf50;
				color: white;
				border: none;
				border-radius: 6px;
				cursor: pointer;
				font-size: 13px;
			}

			.copy-btn:hover {
				background: #45a049;
			}

			.code-block {
				background: #f8f9fa;
				border: 1px solid #e0e0e0;
				color: #24292e;
				padding: 16px;
				border-radius: 6px;
				overflow-x: auto;
				margin: 15px 0;
				font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
				font-size: 13px;
				line-height: 1.6;
			}

			.code-block code {
				display: block;
				white-space: pre;
				color: #24292e;
			}

			.code-block .language-markdown {
				color: #24292e;
			}

			.inline-code {
				background: #f5f5f5;
				color: #d63384;
				padding: 2px 6px;
				border-radius: 4px;
				font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
				font-size: 0.9em;
				border: 1px solid #e0e0e0;
			}

			.evaluation-item li {
				margin: 8px 0 8px 20px;
				line-height: 1.6;
			}

			.evaluation-item strong {
				color: #333;
			}

			.evaluation-item h2,
			.evaluation-item h3,
			.evaluation-item h4 {
				margin-top: 20px;
			}

			.history-panel {
				background: white;
				border-radius: 12px;
				padding: 25px;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
			}

			.history-list {
				max-height: 400px;
				overflow-y: auto;
			}

			.history-item {
				padding: 15px;
				border-bottom: 1px solid #f0f0f0;
				cursor: pointer;
				transition: background 0.3s;
			}

			.history-item:hover {
				background: #f8f9fa;
			}

			.history-item:last-child {
				border-bottom: none;
			}

			.history-item-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 8px;
			}

			.history-item-title {
				font-weight: 600;
				color: #333;
				font-size: 14px;
			}

			.history-item-time {
				font-size: 12px;
				color: #999;
			}

			.history-item-preview {
				font-size: 13px;
				color: #666;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.empty-state {
				text-align: center;
				padding: 40px;
				color: #999;
			}

			.error-message {
				background: #ffebee;
				border-left-color: #f44336;
				color: #c62828;
			}

			@media (max-width: 968px) {
				.main-content {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<header>
				<h1>🚀 提示词优化助手</h1>
				<p>基于AI的智能提示词评估与优化工具</p>
				<p style="font-size: 0.9em; margin-top: 10px; opacity: 0.8">
					⚠️ 使用前请先运行 start.bat 启动服务器
				</p>
			</header>

			<div class="main-content">
				<div class="panel">
					<div class="panel-header">
						<h2><span class="icon">✏️</span> 原始提示词</h2>
					</div>
					<textarea
						id="inputPrompt"
						placeholder="请输入您的提示词..."
					></textarea>
					<div class="btn-group">
						<button
							class="btn-primary"
							id="optimizeBtn"
							onclick="optimizePrompt()"
						>
							开始优化
						</button>
						<button class="btn-secondary" onclick="clearInput()">清空</button>
					</div>
				</div>

				<div class="panel">
					<div class="panel-header">
						<h2><span class="icon">✨</span> 优化结果</h2>
					</div>
					<div class="output-content" id="outputContent">
						<div class="empty-state">
							<p>在左侧输入提示词，点击"开始优化"按钮</p>
						</div>
					</div>
				</div>
			</div>

			<div class="history-panel">
				<div class="panel-header">
					<h2><span class="icon">📜</span> 历史记录</h2>
					<button
						class="btn-secondary"
						onclick="clearHistory()"
						style="flex: none; padding: 8px 16px"
					>
						清空历史
					</button>
				</div>
				<div class="history-list" id="historyList">
					<div class="empty-state">
						<p>暂无历史记录</p>
					</div>
				</div>
			</div>
		</div>

		<script>
			const API_URL = '';
			const API_KEY = '';

			let history = JSON.parse(localStorage.getItem('promptHistory') || '[]');

			function updateHistoryDisplay() {
				const historyList = document.getElementById('historyList');

				if (history.length === 0) {
					historyList.innerHTML =
						'<div class="empty-state"><p>暂无历史记录</p></div>';
					return;
				}

				historyList.innerHTML = history
					.map(
						(item, index) => `
                <div class="history-item" onclick="loadHistory(${index})">
                    <div class="history-item-header">
                        <div class="history-item-title">${item.title}</div>
                        <div class="history-item-time">${item.time}</div>
                    </div>
                    <div class="history-item-preview">${item.preview}</div>
                </div>
            `
					)
					.join('');
			}

			function loadHistory(index) {
				const item = history[index];
				document.getElementById('inputPrompt').value = item.original;
				document.getElementById('outputContent').innerHTML = item.result;
			}

			function clearHistory() {
				if (confirm('确定要清空所有历史记录吗？')) {
					history = [];
					localStorage.setItem('promptHistory', '[]');
					updateHistoryDisplay();
				}
			}

			function clearInput() {
				document.getElementById('inputPrompt').value = '';
				document.getElementById('outputContent').innerHTML =
					'<div class="empty-state"><p>在左侧输入提示词，点击"开始优化"按钮</p></div>';
			}

			function copyToClipboard(text) {
				navigator.clipboard
					.writeText(text)
					.then(() => {
						alert('已复制到剪贴板！');
					})
					.catch((err) => {
						console.error('复制失败:', err);
					});
			}

			async function optimizePrompt() {
				const input = document.getElementById('inputPrompt').value.trim();

				if (!input) {
					alert('请输入提示词！');
					return;
				}

				const btn = document.getElementById('optimizeBtn');
				const outputContent = document.getElementById('outputContent');

				btn.disabled = true;
				btn.textContent = '优化中...';

				outputContent.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在分析和优化您的提示词...</p>
                </div>
            `;

				const systemPrompt = `你是一个专业的提示词优化专家。请根据以下标准评估和改进提示词：

评估标准：
1. 清晰度：提示是否清晰地传达了其意图，没有歧义？
2. 准确度：提示是否重点突出、具体地描述了预期结果？
3. 深度：提示是否考虑到了请求的细微差别，避免了流于表面的细节？
4. 相关性：提示是否与预期任务或问题一致，没有偏离？

评分标准（1-5）：
1 = 差
2 = 一般
3 = 好
4 = 很好
5 = 优秀

请严格按照以下 Markdown 格式输出：

## 评估结果

**清晰度：** X/5 - [评分理由]

**准确度：** X/5 - [评分理由]

**深度：** X/5 - [评分理由]

**相关性：** X/5 - [评分理由]

## 优缺点分析

**优点：**
- [列出主要优点]

**缺点：**
- [列出需要改进的地方]

## 改进建议

[具体的改进建议，可以包含列表或段落]

## 优化后的提示词

\`\`\`markdown
[提供优化后的完整提示词版本，必须用代码块包裹]
\`\`\`

重要提示：
1. 优化后的提示词必须使用 markdown 代码块包裹
2. 如果优化后的提示词中包含代码示例，请使用对应语言的代码块
3. 保持格式整洁，合理使用标题、列表和强调`;

				try {
					const response = await fetch(API_URL, {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
						},
						body: JSON.stringify({
							model: 'auto',
							messages: [
								{ role: 'system', content: systemPrompt },
								{
									role: 'user',
									content: `请评估和优化以下提示词：\n\n${input}`,
								},
							],
						}),
					});

					if (!response.ok) {
						throw new Error(`HTTP error! status: ${response.status}`);
					}

					const data = await response.json();
					const result = data.choices[0].message.content;

					const formattedResult = formatResult(result);
					outputContent.innerHTML = formattedResult;

					const historyItem = {
						title: input.substring(0, 20) + (input.length > 20 ? '...' : ''),
						preview: input.substring(0, 50) + (input.length > 50 ? '...' : ''),
						original: input,
						result: formattedResult,
						time: new Date().toLocaleString('zh-CN'),
					};

					history.unshift(historyItem);
					if (history.length > 20) {
						history = history.slice(0, 20);
					}
					localStorage.setItem('promptHistory', JSON.stringify(history));
					updateHistoryDisplay();
				} catch (error) {
					console.error('Error:', error);
					outputContent.innerHTML = `
                    <div class="evaluation-item error-message">
                        <h3>❌ 错误</h3>
                        <p>优化过程中出现错误：${error.message}</p>
                        <p>请检查网络连接或稍后重试。</p>
                    </div>
                `;
				} finally {
					btn.disabled = false;
					btn.textContent = '开始优化';
				}
			}

			function formatResult(text) {
				const parts = text.split(/## 优化后的提示词/);

				let evaluationPart = parts[0] || '';
				let improvedPrompt = '';

				if (parts.length > 1) {
					const promptSection = parts[1].trim();

					const codeBlockMatch = promptSection.match(
						/```(?:markdown)?\s*([\s\S]*?)```/
					);

					if (codeBlockMatch) {
						improvedPrompt = codeBlockMatch[1].trim();
						evaluationPart +=
							'\n\n## 优化后的提示词\n\n已在下方单独展示优化后的完整提示词。';
					} else {
						improvedPrompt = promptSection;
					}
				}

				let html = evaluationPart;

				html = html.replace(
					/```(\w*)\s*([\s\S]*?)```/g,
					(match, lang, code) => {
						const escapedCode = code
							.trim()
							.replace(/&/g, '&amp;')
							.replace(/</g, '&lt;')
							.replace(/>/g, '&gt;');
						return `<pre class="code-block"><code class="language-${
							lang || 'text'
						}">${escapedCode}</code></pre>`;
					}
				);

				html = html.replace(
					/`([^`\n]+)`/g,
					'<code class="inline-code">$1</code>'
				);

				html = html.replace(
					/^### (.*)$/gm,
					'<h4 style="color: #555; margin: 15px 0 10px 0; font-size: 1.05em; font-weight: 600;">$1</h4>'
				);
				html = html.replace(
					/^## (.*)$/gm,
					'<h3 style="color: #667eea; margin: 20px 0 15px 0; font-size: 1.2em; font-weight: 600; border-bottom: 2px solid #e0e0e0; padding-bottom: 8px;">$1</h3>'
				);
				html = html.replace(
					/^# (.*)$/gm,
					'<h2 style="color: #333; margin: 25px 0 15px 0; font-size: 1.4em; font-weight: 700;">$1</h2>'
				);

				html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
				html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

				html = html.replace(
					/^(\d+)\. (.+)$/gm,
					'<li style="margin: 8px 0 8px 20px; line-height: 1.6;">$2</li>'
				);
				html = html.replace(
					/^- (.+)$/gm,
					'<li style="margin: 8px 0 8px 20px; line-height: 1.6;">$1</li>'
				);

				html = html.replace(
					/\n\n/g,
					'</p><p style="margin: 10px 0; line-height: 1.8; color: #333;">'
				);
				html = html.replace(/\n/g, '<br>');

				if (improvedPrompt) {
					const escapedPrompt = improvedPrompt
						.replace(/&/g, '&amp;')
						.replace(/</g, '&lt;')
						.replace(/>/g, '&gt;');

					html += `
                    <div class="improved-prompt">
                        <h3>📋 优化后的提示词（完整版）</h3>
                        <div class="prompt-text">${escapedPrompt.replace(
													/\n/g,
													'<br>'
												)}</div>
                        <button class="copy-btn" onclick="copyToClipboard(\`${improvedPrompt
													.replace(/\\/g, '\\\\')
													.replace(/`/g, '\\`')
													.replace(/\n/g, '\\n')}\`)">
                            📋 复制优化后的提示词
                        </button>
                    </div>
                `;
				}

				return `<div class="evaluation-item"><div style="margin: 0; line-height: 1.8; color: #333;"><p style="margin: 0;">${html}</p></div></div>`;
			}

			updateHistoryDisplay();
		</script>
	</body>
</html>
