# 工作记录系统配置
# 用于自动记录任务执行过程和产出

work_records:
  
  # 存储配置
  storage:
    location: "records/"
    primary_storage: "github_repo"
    
    # 目录结构
    structure:
      - "daily/"           # 每日工作日志
      - "tasks/"           # 任务详细记录
      - "reports/"         # 汇总报告
      - "knowledge/"       # 知识库
    
    # 存储限制
    max_daily_logs: 90     # 保留90天
    max_task_records: 500  # 保留500条任务记录
    auto_cleanup: true
    cleanup_after: "90天"
  
  # 记录类型
  record_types:
    
    # 每日工作日志
    daily_log:
      name: "每日工作日志"
      location: "records/daily/{date}.md"
      format: "markdown"
      auto_generate: true
      generate_time: "18:00"
      
      content:
        - "概览统计"
        - "已完成任务列表"
        - "进行中任务列表"
        - "待确认任务列表"
        - "失败任务列表"
        - "智能体工作统计"
        - "今日数据"
        - "异常处理"
        - "优化建议"
    
    # 任务详细记录
    task_record:
      name: "任务详细记录"
      location: "records/tasks/{task_id}/"
      
      files:
        - "task.yaml"        # 任务元数据
        - "workflow.yaml"    # 执行流程
        - "outputs/"         # 产出文件
        - "logs/"            # 执行日志
        - "feedback.yaml"    # 用户反馈
      
      content:
        - "任务基本信息"
        - "用户输入"
        - "工作流进度"
        - "智能体协作记录"
        - "产出结果"
        - "用户反馈"
        - "决策日志"
    
    # 汇总报告
    reports:
      name: "汇总报告"
      location: "reports/"
      
      types:
        - "daily_summary.md"      # 每日汇总
        - "weekly_report.md"      # 每周报告
        - "monthly_report.md"     # 每月报告
        - "task_analysis.md"      # 任务分析
    
    # 知识库
    knowledge_base:
      name: "知识库"
      location: "records/knowledge/"
      
      categories:
        - "content_templates/"     # 内容模板
        - "code_snippets/"         # 代码片段
        - "workflows/"             # 工作流模板
        - "best_practices/"        # 最佳实践
        - "lessons_learned/"       # 经验教训

# 每日工作日志模板
daily_log_template: |
  # 📊 每日工作日志 - {date}
  
  ## 概览
  
  - 总任务数：{total_tasks}
  - 完成数：{completed_tasks}
  - 进行中：{in_progress_tasks}
  - 待确认：{pending_confirmation_tasks}
  - 失败数：{failed_tasks}
  
  ## ✅ 已完成任务
  
  ### 1. {task_title}
  - **任务ID**：{task_id}
  - **时间**：{start_time} - {end_time}
  - **智能体**：{agents}
  - **产出**：{output_link}
  - **详情**：{details}
  
  ## 🔄 进行中任务
  
  ### 1. {task_title}
  - **任务ID**：{task_id}
  - **开始时间**：{start_time}
  - **当前步骤**：{current_step}
  - **进度**：{progress}%
  - **预计完成**：{estimated_completion}
  
  ## ⏳ 待确认任务
  
  ### 1. {task_title}
  - **任务ID**：{task_id}
  - **待确认操作**：{pending_action}
  - **确认截止**：{deadline}
  - **操作**：回复 `/confirm {task_id}` 确认，或 `/reject {task_id}` 拒绝
  
  ## ❌ 失败任务
  
  ### 1. {task_title}
  - **任务ID**：{task_id}
  - **失败原因**：{failure_reason}
  - **处理方式**：{handling}
  
  ## 🤖 智能体工作统计
  
  | 智能体 | 任务数 | 总时长 | 成功率 |
  |--------|--------|--------|--------|
  | online_claw | {count} | {duration} | {success_rate} |
  | mobile_claw | {count} | {duration} | {success_rate} |
  | pc_claw | {count} | {duration} | {success_rate} |
  
  ## 📈 今日数据
  
  | 指标 | 数值 |
  |------|------|
  | 社交媒体发布 | {social_posts} |
  | 代码提交 | {code_commits} |
  | 信息收集 | {info_collections} |
  | 总工作时长 | {total_duration} |
  
  ## ⚠️ 异常处理
  
  {exceptions}
  
  ## 💡 优化建议
  
  {suggestions}

# 任务详细记录模板
task_record_template: |
  # 任务记录 - {task_id}
  
  ## 基本信息
  
  - **任务ID**：{task_id}
  - **任务类型**：{task_type}
  - **任务模板**：{template_name}
  - **状态**：{status}
  - **优先级**：{priority}
  - **风险等级**：{risk_level}
  
  ## 时间信息
  
  - **创建时间**：{created_at}
  - **开始时间**：{started_at}
  - **完成时间**：{completed_at}
  - **执行时长**：{duration}
  
  ## 用户输入
  
  {user_input}
  
  ## 工作流进度
  
  {workflow_progress}
  
  ## 智能体协作
  
  - **主执行智能体**：{assigned_agent}
  - **协作智能体**：{collaborating_agents}
  
  ## 产出结果
  
  {result}
  
  ## 用户反馈
  
  - **用户评分**：{user_rating}
  - **用户评论**：{user_comment}
  - **学习记录**：{learned}
  
  ## 决策日志
  
  {decision_log}

# 知识库模板

knowledge_templates:
  
  # 内容模板
  content_template: |
    # 内容模板 - {template_id}
    
    ## 基本信息
    
    - **模板ID**：{template_id}
    - **名称**：{name}
    - **平台**：{platform}
    - **创建时间**：{created_at}
    - **使用次数**：{usage_count}
    - **成功率**：{success_rate}
    
    ## 内容结构
    
    {structure}
    
    ## 成功因素
    
    {success_factors}
    
    ## 性能数据
    
    {performance}
    
    ## 适用场景
    
    {applicable_scenarios}
  
  # 代码片段模板
  code_snippet_template: |
    # 代码片段 - {snippet_id}
    
    ## 基本信息
    
    - **片段ID**：{snippet_id}
    - **名称**：{name}
    - **语言**：{language}
    - **框架**：{framework}
    - **创建时间**：{created_at}
    - **使用次数**：{usage_count}
    
    ## 代码内容
    
    ```{language}
    {code_content}
    ```
    
    ## 使用说明
    
    {usage_instructions}
    
    ## 注意事项
    
    {notes}
  
  # 最佳实践模板
  best_practice_template: |
    # 最佳实践 - {practice_id}
    
    ## 基本信息
    
    - **实践ID**：{practice_id}
    - **名称**：{name}
    - **类别**：{category}
    - **创建时间**：{created_at}
    - **更新时间**：{updated_at}
    
    ## 实践内容
    
    {content}
    
    ## 适用场景
    
    {applicable_scenarios}
    
    ## 学习来源
    
    {learned_from}
    
    ## 效果评估
    
    {effectiveness}
  
  # 经验教训模板
  lesson_template: |
    # 经验教训 - {lesson_id}
    
    ## 基本信息
    
    - **教训ID**：{lesson_id}
    - **任务ID**：{task_id}
    - **任务类型**：{task_type}
    - **失败类型**：{failure_type}
    - **时间**：{timestamp}
    
    ## 失败详情
    
    - **失败原因**：{failure_reason}
    - **详细描述**：{details}
    
    ## 教训总结
    
    - **核心教训**：{lesson}
    - **预防措施**：{prevention}
    
    ## 相关任务
    
    {related_tasks}
    
    ## 改进建议
    
