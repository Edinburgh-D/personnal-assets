# 记录生成规则

generation_rules:
  
  # 每日日志生成
  daily_log_generation:
    trigger: "每日18:00"
    process:
      - "收集当日所有任务"
      - "分类统计"
      - "生成日志文件"
      - "发送到Kimi群聊"
    
    notification:
      channel: "kimi_group"
      format: "markdown"
      include_summary: true
  
  # 任务记录生成
  task_record_generation:
    trigger: "任务完成时"
    process:
      - "收集任务执行数据"
      - "生成任务记录文件"
      - "保存到GitHub仓库"
      - "更新知识库（如适用）"
    
    save_to: "records/tasks/{task_id}/"
  
  # 知识库更新
  knowledge_base_update:
    trigger: "任务成功且用户满意"
    process:
      - "分析成功因素"
      - "生成知识库条目"
      - "保存到知识库目录"
    
    categories:
      - "成功产出 → successful_outputs"
      - "用户偏好 → user_preferences_memory"
      - "决策模式 → decision_patterns"
  
  # 失败教训记录
  failure_lesson_record:
    trigger: "任务失败或用户不满意"
    process:
      - "分析失败原因"
      - "生成教训条目"
      - "保存到失败教训目录"
    
    save_to: "records/knowledge/lessons_learned/"