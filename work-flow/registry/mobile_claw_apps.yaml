# Mobile Claw App能力清单
# 基于2025-04-29实测结果，更新智能体能力定义

mobile_claw_apps:
  
  # 完全可操作的App（32个）
  fully_operational:
    
    # AI聊天类
    ai_chat:
      - name: "ChatGPT"
        capabilities: ["完整对话流", "图片生成", "内容生成"]
        priority: "primary"
      
      - name: "Claude"
        capabilities: ["完整对话流", "代码生成", "内容分析"]
        priority: "primary"
      
      - name: "Grok"
        capabilities: ["完整对话流", "模式切换"]
        priority: "primary"
      
      - name: "Perplexity"
        capabilities: ["AI搜索", "总结", "建议"]
        priority: "primary"
      
      - name: "Kimi"
        capabilities: ["完整UI对话", "中文内容生成"]
        priority: "primary"
      
      - name: "Local Dream"
        capabilities: ["本地AI图像生成"]
        priority: "secondary"
    
    # 社交平台类
    social_media:
      - name: "Instagram"
        capabilities: ["浏览", "滑动", "发帖", "互动"]
        priority: "primary"
      
      - name: "Facebook"
        capabilities: ["浏览", "互动"]
        priority: "primary"
      
      - name: "Threads"
        capabilities: ["浏览", "互动", "发帖"]
        priority: "primary"
      
      - name: "X (Twitter)"
        capabilities: ["浏览", "互动"]
        limitations: ["有广告弹窗"]
        priority: "primary"
      
      - name: "Discord"
        capabilities: ["聊天", "社区互动"]
        priority: "secondary"
      
      - name: "LinkedIn"
        capabilities: ["浏览", "互动", "求职"]
        priority: "secondary"
      
      - name: "rednote (小红书)"
        capabilities: ["浏览", "发帖", "互动"]
        priority: "primary"
      
      - name: "Quora"
        capabilities: ["浏览", "搜索", "提问"]
        priority: "secondary"
    
    # 新闻/内容类
    news_content:
      - name: "AP News"
        capabilities: ["浏览", "多标签", "新闻收集"]
        priority: "primary"
      
      - name: "Hacker News"
        capabilities: ["浏览", "多标签", "技术新闻"]
        priority: "primary"
      
      - name: "Ground News"
        capabilities: ["新闻聚合", "多视角对比"]
        priority: "primary"
      
      - name: "Medium"
        capabilities: ["浏览", "阅读", "深度文章"]
        priority: "primary"
      
      - name: "Read Chan"
        capabilities: ["社区浏览", "4chan客户端"]
        priority: "secondary"
    
    # 浏览器类
    browser:
      - name: "Chrome"
        capabilities: ["导航", "搜索", "填表单", "网页浏览"]
        priority: "primary"
    
    # 系统类
    system:
      - name: "Phone"
        capabilities: ["通话记录", "拨打"]
        priority: "system"
      
      - name: "Messages"
        capabilities: ["短信列表", "对话"]
        priority: "system"
      
      - name: "Camera"
        capabilities: ["拍照", "变焦", "切换镜头"]
        priority: "system"
      
      - name: "Settings"
        capabilities: ["所有设置项"]
        priority: "system"
    
    # 工具类
    tools:
      - name: "Xed-Editor"
        capabilities: ["代码编辑", "文件管理"]
        priority: "secondary"
      
      - name: "Clash"
        capabilities: ["代理切换", "日志", "设置"]
        priority: "system"
      
      - name: "MacroDroid"
        capabilities: ["自动化任务编排"]
        priority: "secondary"
      
      - name: "Shizuku"
        capabilities: ["权限管理", "配对"]
        priority: "system"
      
      - name: "Google Earth"
        capabilities: ["搜索", "浏览", "项目管理"]
        priority: "secondary"
    
    # 其他
    other:
      - name: "Proton Mail"
        capabilities: ["邮件收发"]
        priority: "secondary"
      
      - name: "TextNow"
        capabilities: ["短信", "电话"]
        priority: "secondary"
      
      - name: "V2er"
        capabilities: ["V2EX客户端", "完整UI"]
        priority: "secondary"
      
      - name: "OfferToday"
        capabilities: ["浏览职位", "申请"]
        priority: "secondary"
      
      - name: "wallflow"
        capabilities: ["壁纸浏览", "收藏", "设置"]
        priority: "secondary"
  
  # 受限/打不开的App（28个）
  limited_or_blocked:
    
    # WebView类（内部不可操作）
    webview_issues:
      - name: "GitHub App"
        reason: "WebView，内部不可点击"
        workaround: "使用Chrome访问GitHub网页版"
      
      - name: "Notion"
        reason: "WebView，文档内不可编辑"
        workaround: "使用Chrome访问Notion网页版"
      
      - name: "Spotify"
        reason: "WebView，内部不可操作"
      
      - name: "FT"
        reason: "WebView渲染问题"
    
    # Accessibility限制类
    accessibility_blocked:
      - name: "Microsoft Copilot"
        reason: "Accessibility限制"
      
      - name: "Leonardo.Ai"
        reason: "Accessibility限制"
      
      - name: "Notion Calendar"
        reason: "Accessibility限制"
      
      - name: "Scoopz"
        reason: "Accessibility限制"
      
      - name: "Replit"
        reason: "Accessibility限制"
      
      - name: "Speak"
        reason: "Accessibility限制"
      
      - name: "Bloomberg"
        reason: "Accessibility限制"
        workaround: "使用Chrome访问Bloomberg网页版"
      
      - name: "Reuters"
        reason: "Accessibility限制"
        workaround: "使用Chrome访问Reuters网页版"
      
      - name: "CNN"
        reason: "Accessibility限制"
        workaround: "使用Chrome访问CNN网页版"
      
      - name: "PixVerse"
        reason: "Accessibility限制"
      
      - name: "Arts & Culture"
        reason: "Accessibility限制"
      
      - name: "BBC World Service"
        reason: "Accessibility限制"
      
      - name: "Apple Music"
        reason: "Accessibility限制"
      
      - name: "Guardian"
        reason: "Accessibility限制"
      
      - name: "Apple TV"
        reason: "Accessibility限制"
      
      - name: "Glassdoor"
        reason: "Accessibility限制"
      
      - name: "Indeed Job Search"
        reason: "Accessibility限制"
      
      - name: "Kalshi"
        reason: "Accessibility限制"
      
      - name: "Character.AI"
        reason: "Accessibility限制"
    
    # 金融安全防护类
    financial_blocked:
      - name: "Coinbase"
        reason: "金融安全防护"
      
      - name: "Binance"
        reason: "金融安全防护"
    
    # 其他问题
    other_issues:
      - name: "TikTok"
        reason: "网络不稳定"
      
      - name: "Reddit"
        reason: "弹窗遮挡"
      
      - name: "Nova"
        reason: "加载中/启动慢"
      
      - name: "A Little to the Left"
        reason: "Unity游戏，无UI元素"
  
  # 黑名单（完全禁止）
  blacklist:
    - name: "微信"
      reason: "金融安全，完全禁止"
    
    - name: "PayPal"
      reason: "金融安全防护"
    
    - name: "文件管理器"
      reason: "未安装"

# 能力映射（用于任务模板）
capability_mapping:
  
  # 图片生成
  image_generation:
    primary: "ChatGPT"
    alternatives: ["Claude", "Local Dream"]
    blocked: ["Leonardo.Ai", "PixVerse"]
  
  # 内容生成
  content_generation:
    primary: "ChatGPT"
    alternatives: ["Claude", "Grok", "Kimi", "Perplexity"]
    blocked: ["Microsoft Copilot", "Character.AI"]
  
  # 社交媒体发布
  social_posting:
    instagram:
      app: "Instagram"
      capabilities: ["浏览", "发帖", "互动"]
    
    facebook:
      app: "Facebook"
      capabilities: ["浏览", "互动"]
    
    threads:
      app: "Threads"
      capabilities: ["浏览", "发帖", "互动"]
    
    twitter:
      app: "X"
      capabilities: ["浏览", "互动"]
      limitations: ["有广告弹窗"]
    
    xiaohongshu:
      app: "rednote"
      capabilities: ["浏览", "发帖", "互动"]
    
    medium:
      app: "Medium"
      capabilities: ["浏览", "阅读", "发布文章"]
  
  # 新闻收集
  news_collection:
    primary:
      - "AP News"
      - "Hacker News"
      - "Ground News"
    
    blocked:
      - "Bloomberg"
      - "Reuters"
      - "CNN"
      - "BBC"
      - "Guardian"
    
    workaround: "使用Chrome访问网页版"
  
  # 深度文章
  deep_articles:
    primary: "Medium"
    alternatives: ["Hacker News"]
  
  # 代码相关
  code_related:
    available:
      - "Xed-Editor"  # 本地代码编辑
      - "V2er"  # V2EX技术社区
    
    blocked:
      - "GitHub App"  # WebView问题
      - "Replit"  # Accessibility限制
    
    workaround: "使用Chrome访问GitHub网页版，或由online_claw处理GitHub操作"

# 任务执行策略
execution_strategy:
  
  # 图片生成任务
  image_generation:
    step_1: "使用ChatGPT生成图片"
    fallback_1: "使用Claude生成图片"
    fallback_2: "使用Local Dream本地生成"
    blocked_apps: ["Leonardo.Ai", "PixVerse"]
  
  # 社交媒体发布任务
  social_posting:
    instagram:
      primary: "Instagram App"
      fallback: "Chrome网页版"
    
    xiaohongshu:
      primary: "rednote App"
      fallback: "Chrome网页版"
    
    threads:
      primary: "Threads App"
      fallback: "Chrome网页版"
  
  # 新闻收集任务
  news_collection:
    primary_apps: ["AP News", "Hacker News", "Ground News"]
    blocked_apps: ["Bloomberg", "Reuters", "CNN"]
    workaround: "使用Chrome访问网页版收集新闻"
  
  # 深度文章阅读
  deep_reading:
    primary: "Medium App"
    fallback: "Chrome网页版"

# App选择优先级
app_priority:
  
  # AI聊天
  ai_chat:
    - "ChatGPT"  # 最优先
    - "Claude"
    - "Grok"
    - "Perplexity"
    - "Kimi"
  
  # 社交媒体
  social:
    - "Instagram"
    - "Threads"
    - "rednote"
    - "Facebook"
    - "X"
  
  # 新闻
  news:
    - "AP News"
    - "Hacker News"
    - "Ground News"
    - "Medium"
    - "Chrome（网页版）"  # Bloomberg/Reuters/CNN的替代方案