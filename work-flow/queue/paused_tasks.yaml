# 暂停任务状态文件
# 用于存储因过载或其他原因暂停的任务

paused_tasks: []

# 示例暂停任务（仅供参考，实际使用时删除）
examples:
  
  - task_id: "task_20250115_001"
    type: "xiaohongshu_post"
    template: "xiaohongshu_post"
    status: "paused"
    reason: "overload"
    priority: "normal"
    
    # 进度保存（关键：用于恢复）
    current_step: 2
    total_steps: 3
    step_name: "生成图片"
    step_status: "in_progress"
    step_progress: 50  # 50%完成
    
    # 中间产物（关键：用于恢复）
    intermediate_outputs:
      step_1:
        name: "生成内容提示词"
        status: "completed"
        agent: "online_claw"
        output:
          content_prompt: "推荐5个实用AI工具，包括ChatGPT、Gemini、Claude等..."
          hashtags: ["#AI", "#科技", "#工具"]
          post_time: "20:30"
        saved_at: "2025-01-15 09:10:00"
        file_saved: "outputs/task_001_step1.yaml"
    
    # 用户输入（用于恢复）
    user_input:
      topic: "AI工具推荐"
      additional_requirements: "推荐5个实用AI工具"
    
    # 执行智能体
    assigned_agent: "mobile_claw"
    collaborating_agents:
      - "online_claw"
      - "mobile_claw"
    
    # 过载信息
    overload_info:
      agent: "mobile_claw"
      detected_at: "2025-01-15 09:15:00"
      reason: "Kimi API服务过载"
      response_time: "35秒"
      error_message: "服务过载，请稍后再试"
    
    # 时间记录
    created_at: "2025-01-15 09:00:00"
    started_at: "2025-01-15 09:05:00"
    paused_at: "2025-01-15 09:15:00"
    
    # 恢复信息
    recovery:
      status: "waiting"  # waiting / recovering / recovered
      assigned_agent: null
      started_at: null
      completed_at: null
    
    # 决策日志
    decision_log:
      - step: "task_creation"
        decision: "auto_approve"
        reason: "低风险任务，符合自动批准规则"
        timestamp: "2025-01-15 09:00:00"
      
      - step: "overload_detected"
        decision: "save_and_pause"
        reason: "检测到服务过载，保存状态并暂停"
        timestamp: "2025-01-15 09:15:00"
  
  - task_id: "task_20250115_002"
    type: "code_development"
    template: "code_development"
    status: "paused"
    reason: "overload"
    priority: "high"
    
    current_step: 4
    total_steps: 8
    step_name: "编写代码"
    step_status: "in_progress"
    step_progress: 30
    
    intermediate_outputs:
      step_1:
        name: "需求分析"
        status: "completed"
        agent: "online_claw"
        output:
          design_doc: "用户认证模块设计文档..."
        saved_at: "2025-01-15 10:10:00"
      
      step_2:
        name: "生成设计图"
        status: "completed"
        agent: "mobile_claw"
        output:
          design_image_url: "https://..."
        saved_at: "2025-01-15 10:25:00"
      
      step_3:
        name: "分析设计方案"
        status: "completed"
        agent: "online_claw"
        output:
          implementation_plan: "实现方案..."
        saved_at: "2025-01-15 10:40:00"
    
    user_input:
      requirements: "实现用户认证模块"
      target_branch: "feature/user-auth"
      context: "Vue3项目"
    
    assigned_agent: "pc_claw"
    collaborating_agents:
      - "online_claw"
      - "mobile_claw"
      - "pc_claw"
    
    overload_info:
      agent: "pc_claw"
      detected_at: "2025-01-15 11:00:00"
      reason: "Kimi API服务过载"
      response_time: "40秒"
    
    created_at: "2025-01-15 10:00:00"
    started_at: "2025-01-15 10:05:00"
    paused_at: "2025-01-15 11:00:00"
    
    recovery:
      status: "waiting"
      assigned_agent: null
      started_at: null

# 状态说明
status_values:
  - "waiting"      # 等待恢复
  - "recovering"   # 正在恢复
  - "recovered"    # 已恢复

# 原因说明
reason_values:
  - "overload"     # Kimi API服务过载
  - "agent_offline"  # 智能体离线
  - "user_paused"    # 用户手动暂停
  - "dependency_failed"  # 依赖任务失败
  - "timeout"      # 任务超时

# 文件使用说明
usage:
  
  # 添加暂停任务
  add_paused_task:
    trigger: "检测到过载或其他暂停原因"
    action: "将任务状态写入此文件"
    required_fields:
      - "task_id"
      - "current_step"
      - "intermediate_outputs"
      - "overload_info"
      - "paused_at"
    
  # 恢复暂停任务
  recover_paused_task:
    trigger: "智能体恢复或用户发送 /recover"
    action: "读取此文件，从断点继续执行"
    process:
      - "读取任务状态"
      - "获取中间产物"
      - "从current_step继续"
      - "更新recovery.status"
    
  # 清理已完成任务
  cleanup:
    trigger: "任务恢复完成"
    action: "从paused_tasks列表移除"
    archive_to: "records/tasks/{task_id}/"

# 文件维护
maintenance:
  
  # 自动清理
  auto_cleanup:
    enabled: true
    cleanup_after: "30天"
    max_entries: 100
  
  # 定期检查
  periodic_check:
    enabled: true
    interval: "每30分钟"
    action: "检查暂停任务状态，尝试恢复"
  
  # 备份
  backup:
    enabled: true
    backup_to: "queue/paused_tasks_backup.yaml"
    backup_interval: "每次更新后"