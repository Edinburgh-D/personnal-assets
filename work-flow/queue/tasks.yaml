# 任务队列配置
# 用于异步任务处理和批量汇报

queue:
  
  # 存储配置
  storage:
    location: "queue/tasks.yaml"
    backup_location: "queue/tasks_backup.yaml"
    max_tasks: 1000
    auto_cleanup: true
    cleanup_after: "30天"
  
  # 任务状态定义
  status:
    - pending              # 待处理：任务已创建，等待分配
    - assigned             # 已分配：任务已分配给智能体
    - running              # 执行中：智能体正在执行
    - completed            # 已完成：任务成功完成
    - failed               # 失败：任务执行失败
    - waiting_confirmation # 待确认：等待用户确认
    - cancelled            # 已取消：用户取消任务
    - paused               # 已暂停：任务暂停执行
  
  # 任务优先级
  priority:
    - urgent    # 紧急：立即处理，中断当前任务
    - high      # 高：优先处理，插队到队列前端
    - normal    # 普通：正常队列，按顺序处理
    - low       # 低：空闲时处理，队列末端
  
  # 任务类型
  task_types:
    - social_media_post
    - code_development
    - code_bugfix
    - information_collection
    - daily_news
    - image_generation
    - content_generation
  
  # 风险等级
  risk_levels:
    - low       # 低风险：全自动执行
    - medium    # 中风险：批量确认
    - high      # 高风险：人工确认
  
  # 批量汇报配置
  batch_report:
    
    daily_summary:
      name: "每日工作汇总"
      time: "18:00"
      include:
        - completed_tasks
        - failed_tasks
        - waiting_confirmation_tasks
        - in_progress_tasks
      format: "markdown"
      send_to: "kimi_group"
      template: "daily_summary"
    
    weekly_report:
      name: "每周工作报告"
      time: "Sunday 20:00"
      include:
        - weekly_completed_tasks
        - weekly_failed_tasks
        - weekly_metrics
        - knowledge_base_updates
        - optimization_suggestions
      format: "markdown"
      send_to: "kimi_group"
      template: "weekly_report"
    
    urgent_notification:
      name: "紧急通知"
      trigger: "immediate"
      include:
        - high_risk_tasks
        - failed_tasks
        - agent_offline
      format: "markdown"
      send_to: "kimi_group"
      template: "urgent_notification"
  
  # 任务队列管理
  management:
    
    # 任务分配策略
    assignment_strategy:
      algorithm: "capability_match"
      factors:
        - "智能体能力匹配度"
        - "智能体当前负载"
        - "智能体可用性"
        - "任务优先级"
      max_retries: 3
      retry_interval: "5分钟"
    
    # 任务超时配置
    timeout:
      default: "2小时"
      by_type:
        social_media_post: "30分钟"
        code_development: "4小时"
        information_collection: "2小时"
        image_generation: "15分钟"
      on_timeout:
        action: "notify_admin"
        retry: true
        max_retries: 2
    
    # 任务重试配置
    retry:
      max_retries: 3
      retry_interval: "5分钟"
      retry_on:
        - "network_error"
        - "timeout"
        - "agent_unavailable"
      no_retry_on:
        - "user_rejected"
        - "validation_failed"
        - "permission_denied"
    
    # 并发控制
    concurrency:
      max_concurrent_tasks: 10
      by_agent:
        online_claw: 3
        mobile_claw: 2
        pc_claw: 2
      by_priority:
        urgent: 5
        high: 3
        normal: 2
        low: 1
  
  # 任务生命周期
  lifecycle:
    
    # 创建阶段
    creation:
      auto_assign: true
      validate_input: true
      check_dependencies: true
    
    # 执行阶段
    execution:
      track_progress: true
      log_steps: true
      save_intermediate: true
    
    # 完成阶段
    completion:
      validate_output: true
      save_result: true
      update_knowledge: true
      notify_user: true
    
    # 失败阶段
    failure:
      log_error: true
      analyze_reason: true
      save_lesson: true
      notify_user: true
      retry_or_cancel: true

