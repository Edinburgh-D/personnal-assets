# 长期记忆系统配置
# 用于存储用户偏好、决策模式、成功产出、失败教训

memory:
  
  # 存储配置
  storage:
    location: "memory/"
    primary_file: "memory.yaml"
    
    # 记忆文件结构
    files:
      - "user_preferences_memory.yaml"    # 用户偏好记忆
      - "decision_patterns.yaml"          # 决策模式记忆
      - "successful_outputs.yaml"         # 成功产出样本
      - "failure_lessons.yaml"            # 失败教训
      - "task_history.yaml"               # 任务历史
    
    # 存储限制
    max_entries_per_file: 1000
    auto_cleanup: true
    cleanup_after: "90天"
  
  # 记忆类型
  memory_types:
    
    # 短期记忆（会话级）
    short_term:
      name: "短期记忆"
      description: "当前会话的上下文记忆"
      location: "kimi_group_context"
      retention: "当前会话"
      capacity: "最近10条任务"
      usage: "当前任务上下文"
    
    # 长期记忆（持久化）
    long_term:
      name: "长期记忆"
      description: "跨会话的持久化记忆"
      location: "memory/"
      retention: "永久"
      capacity: "无限"
      usage: "跨会话知识"
  
  # 学习机制
  learning_mechanisms:
    
    # 偏好学习
    preference_learning:
      trigger: "用户修改智能体输出"
      action: "分析差异，更新偏好配置"
      examples:
        - user_feedback: "以后小红书都用这个风格"
          action: "更新 xiaohongshu.style"
        - user_feedback: "代码推送前一定要跑测试"
          action: "更新 code_development.testing.required"
      
      # 学习规则
      rules:
        - condition: "用户明确表达偏好"
          action: "立即更新偏好配置"
          confidence: 0.95
        
        - condition: "用户多次修改同一类型输出"
          action: "推断偏好，更新配置"
          confidence: 0.80
        
        - condition: "用户点赞/好评任务产出"
          action: "强化当前偏好"
          confidence: 0.70
    
    # 决策模式学习
    pattern_learning:
      trigger: "用户确认/拒绝决策"
      action: "记录决策模式，提高自动批准率"
      examples:
        - user_decision: "批准代码推送到feature分支"
          action: "记录为自动批准模式"
          pattern_id: "pattern_003"
        
        - user_decision: "拒绝发布时间在14:00的内容"
          action: "记录为禁止模式"
          pattern_id: "pattern_avoid_001"
      
      # 学习规则
      rules:
        - condition: "用户连续3次批准同一类型决策"
          action: "升级为自动批准规则"
          confidence_threshold: 0.90
        
        - condition: "用户连续2次拒绝同一类型决策"
          action: "升级为禁止规则"
          confidence_threshold: 0.85
        
        - condition: "用户批准但附加条件"
          action: "记录为条件批准规则"
          confidence_threshold: 0.75
    
    # 成功产出学习
    success_learning:
      trigger: "任务成功完成且用户满意"
      action: "保存成功模式到知识库"
      examples:
        - task: "小红书图文发布"
          result: "高互动率"
          action: "保存为最佳实践"
        
        - task: "代码开发"
          result: "代码审查A级"
          action: "保存为成功样本"
      
      # 学习规则
      rules:
        - condition: "任务产出获得用户5星评价"
          action: "保存为最佳实践样本"
          save_to: "successful_outputs.yaml"
        
        - condition: "任务产出指标超过平均值50%"
          action: "保存为高绩效样本"
          save_to: "successful_outputs.yaml"
        
        - condition: "用户明确表示'以后就这样'"
          action: "保存为标准模板"
          save_to: "successful_outputs.yaml"
    
    # 失败教训学习
    failure_learning:
      trigger: "任务失败或用户不满意"
      action: "分析失败原因，记录教训"
      examples:
        - task: "小红书发布"
          failure: "发布时间不佳"
          action: "记录教训：避免非高峰时段发布"
        
        - task: "代码推送"
          failure: "测试未通过"
          action: "记录教训：必须测试通过后推送"
      
      # 学习规则
      rules:
        - condition: "任务执行失败"
          action: "分析失败原因，记录教训"
          save_to: "failure_lessons.yaml"
        
        - condition: "用户给出负面评价"
          action: "分析不满意原因，记录教训"
          save_to: "failure_lessons.yaml"
        
        - condition: "用户明确表示'不要这样'"
          action: "记录为禁止模式"
          save_to: "failure_lessons.yaml"
  
  # 记忆应用
  memory_application:
    
    # 应用偏好记忆
    apply_preferences:
      trigger: "任务创建时"
      action: "应用用户偏好配置"
      examples:
        - task_type: "xiaohongshu_post"
          apply:
            - "style: ${memory.user_preferences.xiaohongshu.style}"
            - "post_time: ${memory.user_preferences.xiaohongshu.post_time}"
            - "hashtags: ${memory.user_preferences.xiaohongshu.hashtags}"
    
    # 应用决策模式
    apply_patterns:
      trigger: "决策判断时"
      action: "应用决策模式记忆"
      examples:
        - scenario: "代码推送到feature分支"
          apply:
            - "pattern_003: 自动批准（confidence: 0.90）"
            - "conditions: 测试通过 + 代码审查通过"
    
    # 应用成功模式
    apply_success_patterns:
      trigger: "任务执行时"
      action: "参考成功产出样本"
      examples:
        - task_type: "xiaohongshu_post"
          apply:
            - "参考 sample_001: 高互动率样本"
            - "应用成功因素：标题吸引人 + 发布时间20:30"
    
    # 避免失败教训
    avoid_failure_patterns:
      trigger: "任务执行时"
      action: "避免失败教训"
      examples:
        - task_type: "xiaohongshu_post"
          avoid:
            - "lesson_001: 避免非高峰时段发布"
            - "lesson_002: 避免内容不符合偏好"

