# 指令管理配置
# 如何添加、修改、删除快捷指令

command_management:
  
  # 添加新指令的方式
  
  ## 方式1：通过指令添加（推荐）
  method_1:
    command: "/add_command"
    usage: "/add_command {指令名} {模板名} {描述}"
    example: "/add_command /video video_creation 视频内容创作"
    
    process:
      - step_1: "用户发送 /add_command 指令"
      - step_2: "管理员AI解析指令内容"
      - step_3: "管理员AI验证指令格式"
      - step_4: "管理员AI更新 quick_commands.yaml 文件"
      - step_5: "管理员AI返回确认消息"
    
    response: |
      ✅ 新指令已添加
      📝 指令名：{command_name}
      📋 模板：{template_name}
      💬 描述：{description}
      💾 已保存到GitHub仓库
  
  ## 方式2：通过自然语言添加
  method_2:
    usage: "我想添加一个新指令，叫 /video，用于视频创作"
    example: "我想添加一个新指令：/video，模板是 video_creation，描述是视频内容创作"
    
    process:
      - step_1: "用户用自然语言描述需求"
      - step_2: "管理员AI解析用户意图"
      - step_3: "管理员AI提取指令信息"
      - step_4: "管理员AI创建指令配置"
      - step_5: "管理员AI更新配置文件"
      - step_6: "管理员AI返回确认"
    
    response: |
      ✅ 已理解您的需求，新指令已添加
      📝 指令名：/video
      📋 模板：video_creation
      💬 描述：视频内容创作
      💾 已保存到GitHub仓库
  
  ## 方式3：直接修改配置文件
  method_3:
    usage: "手动编辑 quick_commands.yaml 文件"
    process:
      - step_1: "用户编辑GitHub仓库中的 quick_commands.yaml"
      - step_2: "添加新指令配置"
      - step_3: "推送修改到GitHub"
      - step_4: "发送 /update_config 让管理员AI重新读取"
    
    format: |
      /{command_name}:
        template: "{template_name}"
        description: "{description}"
        usage: "/{command_name} {参数}"
        example: "/{command_name} {示例参数}"
        priority: "normal"
  
  # 修改现有指令
  
  ## 方式1：通过指令修改
  modify_command:
    command: "/modify_command"
    usage: "/modify_command {指令名} {修改内容}"
    example: "/modify_command /xhs priority=high"
    
    process:
      - step_1: "用户发送 /modify_command"
      - step_2: "管理员AI读取当前配置"
      - step_3: "管理员AI修改指定字段"
      - step_4: "管理员AI更新配置文件"
      - step_5: "管理员AI返回确认"
    
    response: |
      ✅ 指令已修改
      📝 指令名：{command_name}
      🔧 修改内容：{modification}
      💾 已保存到GitHub仓库
  
  ## 方式2：通过自然语言修改
  modify_natural_language:
    usage: "修改 /xhs 指令，优先级改为高"
    example: "我想把小红书发布指令的优先级改成高"
    
    process:
      - step_1: "用户用自然语言描述修改需求"
      - step_2: "管理员AI解析修改意图"
      - step_3: "管理员AI修改配置"
      - step_4: "管理员AI更新文件"
      - step_5: "管理员AI返回确认"
  
  # 删除指令
  
  delete_command:
    command: "/delete_command"
    usage: "/delete_command {指令名}"
    example: "/delete_command /video"
    
    process:
      - step_1: "用户发送 /delete_command"
      - step_2: "管理员AI验证指令存在"
      - step_3: "管理员AI从配置文件删除"
      - step_4: "管理员AI更新文件"
      - step_5: "管理员AI返回确认"
    
    response: |
      ✅ 指令已删除
      📝 指令名：{command_name}
      💾 已保存到GitHub仓库
  
  # 查看所有指令
  
  list_commands:
    command: "/list_commands"
    usage: "/list_commands"
    
    response: |
      📋 所有可用指令
      
      **内容创作**
      - /xhs: 发布小红书
      - /ins: 发布Instagram
      - /fb: 发布Facebook
      - /threads: 发布Threads
      - /medium: 发布Medium文章
      - /img: 生成图片
      - /content: 生成内容（不发布）
      
      **代码开发**
      - /dev: 代码开发任务
      - /bugfix: Bug修复
      
      **信息收集**
      - /collect: 收集信息
      - /news: 每日新闻
      - /research: 深度预研
      
      **状态管理**
      - /status: 查询任务状态
      - /today: 今日汇总
      - /week: 本周汇总
      
      **任务操作**
      - /confirm: 确认任务
      - /reject: 拒绝任务
      - /urgent: 标记紧急
      - /pause: 暂停任务
      - /resume: 恢复任务
      - /cancel: 取消任务
      
      **配置管理**
      - /config: 更新配置
      - /pref: 查看偏好
      - /add_command: 添加指令
      - /modify_command: 修改指令
      - /delete_command: 删除指令
      
      **恢复管理**
      - /recover: 恢复暂停任务
      - /recover_status: 查看暂停任务
      
      **帮助**
      - /help: 查看帮助
      - /list_commands: 查看所有指令
  
  # 指令模板格式
  
  template_format: |
    /{command_name}:
      template: "{template_name}"        # 对应的任务模板
      description: "{description}"       # 指令描述
      usage: "/{command_name} {params}"  # 使用方式
      example: "/{command_name} {example}"  # 使用示例
      priority: "{priority}"             # 优先级：urgent/high/normal/low
      auto_approve: true/false           # 是否自动批准
      risk_level: "{risk_level}"         # 风险等级：low/medium/high
  
  # 指令添加示例
  
  examples:
    
    # 示例1：添加视频创作指令
    example_1:
      user_input: "/add_command /video video_creation 视频内容创作"
      admin_response: |
        ✅ 新指令已添加
        📝 指令名：/video
        📋 模板：video_creation
        💬 描述：视频内容创作
        💾 已保存到GitHub仓库
        
        使用方式：/video 主题：{topic}
        示例：/video 主题：AI教程
    
    # 示例2：添加数据分析指令
    example_2:
      user_input: "我想添加一个数据分析指令，叫 /analyze"
      admin_response: |
        ✅ 已理解您的需求，新指令已添加
        📝 指令名：/analyze
        📋 模板：data_analysis
        💬 描述：数据分析任务
        💾 已保存到GitHub仓库
        
        使用方式：/analyze 数据：{data_source}
        示例：/analyze 数据：销售报表
    
    # 示例3：修改指令优先级
    example_3:
      user_input: "/modify_command /xhs priority=high"
      admin_response: |
        ✅ 指令已修改
        📝 指令名：/xhs
        🔧 修改内容：priority=high
        💾 已保存到GitHub仓库
    
    # 示例4：删除指令
    example_4:
      user_input: "/delete_command /video"
      admin_response: |
        ✅ 指令已删除
        📝 指令名：/video
        💾 已保存到GitHub仓库

# 指令管理权限
permissions:
  
  # 所有用户都可以
  all_users:
    - "/list_commands"
    - "/help"
    - "/status"
    - "/today"
    - "/week"
  
  # 需要管理员权限
  admin_only:
    - "/add_command"
    - "/modify_command"
    - "/delete_command"
    - "/config"
    - "/update_config"

# 指令验证
validation:
  
  # 指令名规则
  command_name_rules:
    - "必须以 / 开头"
    - "只能包含字母、数字、下划线"
    - "长度限制：2-20字符"
    - "不能与现有指令重复"
  
  # 模板名规则
  template_name_rules:
    - "必须存在于 task_templates.yaml"
    - "如果不存在，需要先创建模板"
  
  # 验证流程
  validation_process:
    - "检查指令名格式"
    - "检查指令名是否已存在"
    - "检查模板是否存在"
    - "检查参数是否完整"
    - "验证通过后保存"