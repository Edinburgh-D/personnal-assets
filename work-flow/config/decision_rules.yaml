# 决策规则配置
# 用于决策代理系统，根据任务类型和条件自动决策

decision_rules:
  
  # 低风险：全自动执行，无需确认
  auto_approve:
    description: "低风险任务，自动执行，批量汇总"
    conditions:
      
      # 社交媒体发布
      - task_type: "social_media_post"
        platforms: ["xiaohongshu", "instagram", "facebook", "threads", "medium"]
        constraints:
          - "内容符合用户偏好模板"
          - "发布时间在用户设定范围内"
          - "图片质量合格"
          - "符合平台内容规范"
        action: "auto_execute"
        notification: "batch_summary"
      
      # 信息收集
      - task_type: "information_collection"
        sources: ["bloomberg", "reuters", "cnn", "xiaohongshu", "medium"]
        constraints:
          - "仅收集公开信息"
          - "不涉及敏感数据"
          - "不涉及付费内容"
        action: "auto_execute"
        notification: "batch_summary"
      
      # 图片生成
      - task_type: "image_generation"
        tools: ["chatgpt", "gemini", "grok", "midjourney"]
        constraints:
          - "符合内容安全规范"
          - "符合用户偏好风格"
          - "不涉及敏感内容"
        action: "auto_execute"
        notification: "batch_summary"
      
      # 内容生成（不发布）
      - task_type: "content_generation"
        constraints:
          - "仅生成内容，不执行发布"
          - "符合用户偏好模板"
        action: "auto_execute"
        notification: "batch_summary"
  
  # 中风险：批量确认，每日汇总时确认
  batch_confirm:
    description: "中风险任务，批量确认，每日18:00汇总"
    schedule: "18:00"
    format: "markdown_list"
    
    conditions:
      
      # 代码推送到开发分支
      - task_type: "code_push"
        target_branch: ["feature/*", "develop", "dev"]
        constraints:
          - "测试通过"
          - "代码审查通过（如有）"
          - "无安全漏洞"
        action: "batch_confirm"
        confirmation_message: "代码推送到${target_branch}分支，变更：${files_changed}个文件"
      
      # 外网资源下载
      - task_type: "resource_download"
        sources: ["external"]
        constraints:
          - "文件大小 < 100MB"
          - "来源可信"
          - "不涉及敏感内容"
        action: "batch_confirm"
        confirmation_message: "下载资源：${resource_name}，大小：${file_size}"
      
      # 配置文件修改（非系统级）
      - task_type: "config_change"
        level: "non_system"
        constraints:
          - "不涉及系统级配置"
          - "不涉及安全配置"
        action: "batch_confirm"
        confirmation_message: "修改配置：${config_file}"
  
  # 高风险：人工确认，即时通知
  manual_confirm:
    description: "高风险任务，即时通知，等待用户确认"
    notification: "urgent"
    timeout: "30m"
    on_timeout: "cancel"
    
    conditions:
      
      # 代码推送到主分支
      - task_type: "code_push"
        target_branch: ["main", "master", "production", "release/*"]
        constraints: []  # 无约束，必须确认
        action: "immediate_confirm"
        confirmation_message: "⚠️ 代码推送到主分支${target_branch}，请确认"
        require_reason: true
      
      # 系统配置修改
      - task_type: "system_config_change"
        constraints: []  # 无约束，必须确认
        action: "immediate_confirm"
        confirmation_message: "⚠️ 系统配置修改：${config_name}，请确认"
        require_reason: true
      
      # 数据删除
      - task_type: "data_deletion"
        constraints: []  # 无约束，必须确认
        action: "immediate_confirm"
        confirmation_message: "⚠️ 数据删除：${data_type}，请确认"
        require_reason: true
      
      # 外部API调用（敏感）
      - task_type: "external_api_call"
        sensitivity: "high"
        constraints: []  # 无约束，必须确认
        action: "immediate_confirm"
        confirmation_message: "⚠️ 外部API调用：${api_name}，请确认"
      
      # 生产环境部署
      - task_type: "production_deployment"
        constraints: []  # 无约束，必须确认
        action: "immediate_confirm"
        confirmation_message: "⚠️ 生产环境部署，请确认"
        require_reason: true
  
  # 特殊规则：用户自定义
  custom_rules:
    description: "用户自定义规则，可通过自然语言更新"
    rules: []  # 初始为空，用户可添加
  
  # 默认规则：未匹配的任务
  default:
    description: "未匹配的任务类型，默认需要确认"
    action: "immediate_confirm"
    notification: "urgent"
    confirmation_message: "新任务类型：${task_type}，请确认是否执行"