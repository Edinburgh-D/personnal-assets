# 补充指令配置
# 其他常用场景的快捷指令

supplementary_commands:
  
  # 定时任务指令
  scheduled_tasks:
    
    "/schedule":
      action: "schedule_task"
      description: "创建定时任务"
      usage: "/schedule {指令} 时间：{time}"
      examples:
        - "/schedule /xhs 时间：20:30（今晚）"
        - "/schedule /news 时间：09:00（每天）"
        - "/schedule /collect 时间：周末"
      parameters:
        - "指令：要执行的指令"
        - "时间：执行时间（具体时间/每天/每周/周末）"
      response: |
        ✅ 定时任务已创建
        📝 任务ID：{task_id}
        ⏰ 执行时间：{schedule_time}
        📋 任务内容：{command}
        💾 已保存到定时任务队列
  
    "/schedule_list":
      action: "list_scheduled_tasks"
      description: "查看所有定时任务"
      usage: "/schedule_list"
      response: |
        📋 定时任务列表
        
        {scheduled_tasks_list}
        
        💡 发送 /schedule_cancel {task_id} 取消定时任务
  
    "/schedule_cancel":
      action: "cancel_scheduled_task"
      description: "取消定时任务"
      usage: "/schedule_cancel {task_id}"
      response: |
        ✅ 定时任务已取消
        📝 任务ID：{task_id}
  
  # 批量任务指令
  batch_tasks:
    
    "/batch":
      action: "batch_tasks"
      description: "批量执行多个任务"
      usage: "/batch {任务列表}"
      example: "/batch /xhs 主题：AI, /ins topic: Tech, /fb 主题：新闻"
      parameters:
        - "任务列表：多个任务指令，用逗号分隔"
      response: |
        ✅ 批量任务已创建
        📝 任务数量：{count}
        📋 任务列表：
        - task_001: 小红书发布
        - task_002: Instagram发布
        - task_003: Facebook发布
        ⏰ 执行时间：批量时段（10:00-12:00）
        💾 已保存到任务队列
  
    "/batch_confirm":
      action: "batch_confirm"
      description: "批量确认所有待确认任务"
      usage: "/batch_confirm"
      response: |
        ✅ 批量确认完成
        📝 确认数量：{count}
        📋 已确认任务：
        - task_001
        - task_002
        - task_003
  
  # 任务模板管理
  template_management:
    
    "/create_template":
      action: "create_template"
      description: "创建新任务模板"
      usage: "/create_template {模板名} {描述}"
      example: "/create_template video_creation 视频内容创作模板"
      process:
        - step_1: "用户描述模板需求"
        - step_2: "管理员AI生成模板框架"
        - step_3: "用户确认模板内容"
        - step_4: "管理员AI保存模板"
      response: |
        ✅ 任务模板已创建
        📝 模板名：{template_name}
        💬 描述：{description}
        📋 工作流：{workflow}
        💾 已保存到 templates/task_templates.yaml
  
    "/template":
      action: "show_template"
      description: "查看任务模板详情"
      usage: "/template {模板名}"
      example: "/template xiaohongshu_post"
      response: |
        📋 任务模板详情
        
        **模板名**：xiaohongshu_post
        **描述**：生成并发布小红书图文内容
        **风险等级**：low
        **预计时间**：30min
        
        **工作流**：
        1. 生成内容提示词（online_claw）
        2. 生成图片（mobile_claw）
        3. 发布内容（mobile_claw）
        
        **快捷指令**：/xhs
  
    "/list_templates":
      action: "list_templates"
      description: "查看所有任务模板"
      usage: "/list_templates"
      response: |
        📋 所有任务模板
        
        **内容创作**
        - xiaohongshu_post: 小红书图文发布
        - instagram_post: Instagram图文发布
        - facebook_post: Facebook图文发布
        - threads_post: Threads内容发布
        - medium_article: Medium文章发布
        - image_generation: 图片生成
        - content_generation: 内容生成
        
        **代码开发**
        - code_development: 代码开发任务
        - code_bugfix: Bug修复
        
        **信息收集**
        - information_collection: 信息收集整理
        - daily_news: 每日新闻收集
        
        **预研类**
        - deep_research: 深度预研
        - knowledge_collection: 知识搜集
        - tech_research: 技术预研
        - trend_research: 行业趋势预研
        - competitor_research: 竞品分析
        - learning_path: 学习路径规划
  
  # 智能体管理
  agent_management:
    
    "/check_agent":
      action: "check_agent_status"
      description: "检查智能体状态"
      usage: "/check_agent {agent_id}"
      example: "/check_agent mobile_claw"
      response: |
        🤖 智能体状态
        
        **ID**：mobile_claw
        **名称**：手机端Claw
        **状态**：online
        **最后心跳**：2025-01-15 14:30
        **当前任务**：task_001
        **已完成任务**：89
        **成功率**：91%
        
        **可用App**：
        - ChatGPT（完整对话流）
        - Instagram（浏览、发帖、互动）
        - AP News（浏览、新闻收集）
        - Chrome（网页浏览）
  
    "/restart_agent":
      action: "restart_agent"
      description: "重启智能体（发送艾特通知）"
      usage: "/restart_agent {agent_id}"
      example: "/restart_agent mobile_claw"
      response: |
        ✅ 已发送重启通知
        🤖 智能体：{agent_id}
        📝 请艾特 @{agent_id} 确认重启
        
        💡 如果智能体无响应，可能是服务过载
        发送 /recover 恢复暂停任务
  
    "/agent_history":
      action: "agent_task_history"
      description: "查看智能体任务历史"
      usage: "/agent_history {agent_id}"
      example: "/agent_history mobile_claw"
      response: |
        📊 智能体任务历史
        
        **智能体**：mobile_claw
        **最近10个任务**：
        - task_001: 小红书发布（已完成）
        - task_002: Instagram发布（已完成）
        - task_003: 新闻收集（已完成）
        - ...
        
        **统计数据**：
        - 总任务数：89
        - 成功数：81
        - 失败数：8
        - 成功率：91%
  
  # 知识库管理
  knowledge_base_management:
    
    "/kb_add":
      action: "add_knowledge"
      description: "手动添加知识到知识库"
      usage: "/kb_add 类别：{category} 内容：{content}"
      example: "/kb_add 类别：lessons 内容：小红书发布时间应避开14:00"
      response: |
        ✅ 知识已添加
        📚 类别：{category}
        📝 内容：{content}
        💾 已保存到知识库
  
    "/kb_search":
      action: "search_knowledge"
      description: "搜索知识库"
      usage: "/kb_search {关键词}"
      example: "/kb_search 小红书"
      response: |
        🔍 知识库搜索结果
        
        **关键词**：小红书
        
        **找到 5 条相关知识**：
        
        1. **用户偏好**：小红书风格-轻松活泼
        2. **最佳实践**：小红书发布时间-20:30
        3. **成功样本**：小红书图文-AI工具推荐
        4. **失败教训**：避免非高峰时段发布
        5. **任务模板**：xiaohongshu_post
  
    "/kb_update":
      action: "update_knowledge"
      description: "更新知识库内容"
      usage: "/kb_update {knowledge_id} 内容：{new_content}"
      example: "/kb_update lesson_001 内容：小红书最佳发布时间为20:30-21:30"
      response: |
        ✅ 知识已更新
        📝 知识ID：{knowledge_id}
        📝 新内容：{new_content}
        💾 已保存到知识库
  
    "/kb_delete":
      action: "delete_knowledge"
      description: "删除知识库内容"
      usage: "/kb_delete {knowledge_id}"
      response: |
        ✅ 知识已删除
        📝 知识ID：{knowledge_id}
        💾 已更新知识库
  
  # 任务管理补充
  task_management:
    
    "/priority":
      action: "change_priority"
      description: "调整任务优先级"
      usage: "/priority {task_id} {priority}"
      example: "/priority task_001 urgent"
      priorities: ["urgent", "high", "normal", "low"]
      response: |
        ✅ 任务优先级已调整
        📝 任务ID：{task_id}
        🎯 新优先级：{priority}
        💾 已更新任务队列
  
    "/depend":
      action: "set_dependency"
      description: "设置任务依赖关系"
      usage: "/depend {task_id} 依赖：{dependency_task_ids}"
      example: "/depend task_002 依赖：task_001"
      response: |
        ✅ 任务依赖已设置
        📝 任务ID：{task_id}
        🔗 依赖任务：{dependency_task_ids}
        💾 任务将在依赖任务完成后执行
  
    "/clone":
      action: "clone_task"
      description: "克隆历史任务"
      usage: "/clone {history_task_id}"
      example: "/clone task_20250110_003"
      response: |
        ✅ 任务已克隆
        📝 新任务ID：{new_task_id}
        📋 克隆源：{history_task_id}
        💾 已保存到任务队列
  
    "/history":
      action: "task_history"
      description: "查看历史任务"
      usage: "/history {task_id}"
      example: "/history task_20250110_003"
      response: |
        📋 历史任务详情
        
        **任务ID**：task_20250110_003
        **类型**：小红书图文发布
        **状态**：已完成
        **时间**：2025-01-10 09:00-09:35
        
        **产出**：https://xiaohongshu.com/...
        **用户评分**：5
        **用户评论**：很好，继续保持
  
  # 统计分析
  statistics:
    
    "/stats":
      action: "task_statistics"
      description: "统计分析任务数据"
      usage: "/stats {时间范围}"
      examples:
        - "/stats 今日"
        - "/stats 本周"
        - "/stats 本月"
      response: |
        📊 任务统计分析
        
        **时间范围**：{time_range}
        
        **任务统计**：
        - 总任务数：{total}
        - 完成数：{completed}
        - 失败数：{failed}
        - 成功率：{success_rate}
        
        **智能体统计**：
        - online_claw：{count}个任务，{duration}小时
        - mobile_claw：{count}个任务，{duration}小时
        - pc_claw：{count}个任务，{duration}小时
        
        **类型统计**：
        - 内容创作：{count}个
        - 代码开发：{count}个
        - 信息收集：{count}个
        - 预研类：{count}个
  
    "/report":
      action: "generate_custom_report"
      description: "生成自定义报告"
      usage: "/report 类型：{type} 时间：{time_range}"
      examples:
        - "/report 类型：工作总结 时间：本周"
        - "/report 类型：智能体分析 时间：本月"
        - "/report 类型：任务分析 时间：今日"
      response: |
        📄 自定义报告
        
        **报告类型**：{type}
        **时间范围**：{time_range}
        
        {report_content}
        
        💾 报告已保存到 records/reports/
  
  # 提醒设置
  reminders:
    
    "/remind":
      action: "set_reminder"
      description: "设置提醒"
      usage: "/remind 时间：{time} 内容：{content}"
      examples:
        - "/remind 时间：18:00 内容：查看今日汇总"
        - "/remind 时间：周末 内容：执行批量任务"
      response: |
        ✅ 提醒已设置
        ⏰ 提醒时间：{time}
        📝 提醒内容：{content}
        💾 已保存到提醒队列
  
    "/remind_list":
      action: "list_reminders"
      description: "查看所有提醒"
      usage: "/remind_list"
      response: |
        📋 提醒列表
        
        {reminders_list}
        
        💡 发送 /remind_cancel {remind_id} 取消提醒
  
    "/remind_cancel":
      action: "cancel_reminder"
      description: "取消提醒"
      usage: "/remind_cancel {remind_id}"
      response: |
        ✅ 提醒已取消
        📝 提醒ID：{remind_id}
  
  # 工作流可视化
  workflow_visualization:
    
    "/workflow":
      action: "show_workflow"
      description: "查看任务工作流图"
      usage: "/workflow {task_id}"
      example: "/workflow task_001"
      response: |
        🔄 任务工作流
        
        **任务ID**：task_001
        **类型**：小红书图文发布
        
        工作流图：
        Step 1: 生成内容提示词（online_claw） ✓
        Step 2: 生成图片（mobile_claw） ✓
        Step 3: 发布内容（mobile_claw） ✓
        
        💾 状态已保存到GitHub
  
  # 任务测试
  testing:
    
    "/test_template":
      action: "test_template"
      description: "测试任务模板"
      usage: "/test_template {模板名}"
      example: "/test_template xiaohongshu_post"
      response: |
        🧪 模板测试
        
        **模板名**：xiaohongshu_post
        
        测试结果：
        - 工作流步骤：3个 ✓
        - 智能体分配：正确 ✓
        - 决策规则：匹配 ✓
        - 预计时间：30min ✓
        
        ✅ 模板测试通过

