# 快捷指令配置
# 用于快速派发任务，减少输入时间

quick_commands:
  
  # 内容创作快捷指令
  
  "/xhs":
    template: "xiaohongshu_post"
    description: "发布小红书图文"
    usage: "/xhs 主题：{topic}"
    example: "/xhs 主题：AI工具推荐"
    priority: "normal"
    
  "/ins":
    template: "instagram_post"
    description: "发布Instagram图文"
    usage: "/ins topic: {topic}"
    example: "/ins topic: AI trends"
    priority: "normal"
    
  "/fb":
    template: "facebook_post"
    description: "发布Facebook图文"
    usage: "/fb 主题：{topic}"
    example: "/fb 主题：科技动态"
    priority: "normal"
    
  "/threads":
    template: "threads_post"
    description: "发布Threads内容"
    usage: "/threads 主题：{topic}"
    example: "/threads 主题：今日思考"
    priority: "normal"
    
  "/medium":
    template: "medium_article"
    description: "发布Medium文章"
    usage: "/medium 主题：{topic}"
    example: "/medium 主题：AI发展趋势"
    priority: "low"  # 深度文章，周末处理
  
  # 代码开发快捷指令
  
  "/dev":
    template: "code_development"
    description: "启动代码开发任务"
    usage: "/dev 需求：{requirements}，分支：{branch}"
    example: "/dev 需求：用户认证模块，分支：feature/user-auth"
    priority: "high"
    
  "/bugfix":
    template: "code_bugfix"
    description: "修复代码Bug"
    usage: "/bugfix Bug：{description}，日志：{logs}"
    example: "/bugfix Bug：登录超时，日志：timeout error"
    priority: "high"
  
  # 信息收集快捷指令
  
  "/collect":
    template: "information_collection"
    description: "收集信息并整理"
    usage: "/collect 主题：{topic}，来源：{sources}"
    example: "/collect 主题：AI行业动态，来源：彭博社、路透社"
    priority: "normal"
    
  "/news":
    template: "daily_news"
    description: "收集每日新闻"
    usage: "/news 类别：{categories}"
    example: "/news 类别：科技、AI"
    priority: "normal"
  
  # 图片生成快捷指令
  
  "/img":
    template: "image_generation"
    description: "生成图片"
    usage: "/img 描述：{description}，风格：{style}"
    example: "/img 描述：科技感未来城市，风格：简约"
    priority: "normal"
  
  # 内容生成快捷指令（不发布）
  
  "/content":
    template: "content_generation"
    description: "生成内容但不发布"
    usage: "/content 平台：{platform}，主题：{topic}"
    example: "/content 平台：小红书，主题：AI工具推荐"
    priority: "normal"
  
  # 状态查询快捷指令
  
  "/status":
    action: "query_status"
    description: "查询所有任务状态"
    usage: "/status"
    output: "任务状态列表"
    
  "/task":
    action: "query_task"
    description: "查询特定任务详情"
    usage: "/task {task_id}"
    example: "/task task_20250115_001"
    output: "任务详细信息"
    
  "/today":
    action: "daily_summary"
    description: "查看今日工作汇总"
    usage: "/today"
    output: "今日工作日志"
    
  "/week":
    action: "weekly_summary"
    description: "查看本周工作汇总"
    usage: "/week"
    output: "本周工作报告"
  
  # 确认/拒绝快捷指令
  
  "/confirm":
    action: "confirm_task"
    description: "确认待处理任务"
    usage: "/confirm {task_id}"
    example: "/confirm task_20250115_002"
    output: "任务已确认，继续执行"
    
  "/reject":
    action: "reject_task"
    description: "拒绝待处理任务"
    usage: "/reject {task_id} 原因：{reason}"
    example: "/reject task_20250115_002 原因：需要修改"
    output: "任务已拒绝，等待修改"
    
  "/confirm_all":
    action: "confirm_all_pending"
    description: "确认所有待处理任务"
    usage: "/confirm_all"
    output: "所有待处理任务已确认"
    
  "/reject_all":
    action: "reject_all_pending"
    description: "拒绝所有待处理任务"
    usage: "/reject_all 原因：{reason}"
    example: "/reject_all 原因：需要重新规划"
    output: "所有待处理任务已拒绝"
  
  # 配置更新快捷指令
  
  "/config":
    action: "update_config"
    description: "更新偏好配置"
    usage: "/config {key}={value}"
    examples:
      - "/config xiaohongshu.style=专业简洁"
      - "/config notification.summary_time=17:00"
      - "/config code_development.testing.required=false"
    output: "配置已更新"
    
  "/pref":
    action: "show_preferences"
    description: "查看当前偏好配置"
    usage: "/pref {category}"
    examples:
      - "/pref xiaohongshu"
      - "/pref code_development"
      - "/pref notification"
    output: "偏好配置详情"
  
  # 智能体管理快捷指令
  
  "/agents":
    action: "show_agents"
    description: "查看智能体状态"
    usage: "/agents"
    output: "智能体状态列表"
    
  "/agent":
    action: "show_agent"
    description: "查看特定智能体详情"
    usage: "/agent {agent_id}"
    example: "/agent online_claw"
    output: "智能体详细信息"
  
  # 知识库快捷指令
  
  "/kb":
    action: "show_knowledge_base"
    description: "查看知识库内容"
    usage: "/kb {category}"
    examples:
      - "/kb templates"
      - "/kb lessons"
      - "/kb best_practices"
    output: "知识库内容列表"
    
  "/search":
    action: "search_knowledge"
    description: "搜索知识库"
    usage: "/search {keyword}"
    example: "/search 小红书"
    output: "搜索结果"
  
  # 帮助快捷指令
  
  "/help":
    action: "show_help"
    description: "查看帮助信息"
    usage: "/help"
    output: "快捷指令列表"
    
  "/help {command}":
    action: "show_command_help"
    description: "查看特定指令帮助"
    usage: "/help {command}"
    example: "/help /xhs"
    output: "指令详细说明"
  
  # 紧急操作快捷指令
  
  "/urgent":
    action: "mark_urgent"
    description: "标记任务为紧急"
    usage: "/urgent {task_id}"
    example: "/urgent task_20250115_003"
    output: "任务已标记为紧急，优先处理"
    
  "/pause":
    action: "pause_task"
    description: "暂停任务"
    usage: "/pause {task_id}"
    example: "/pause task_20250115_003"
    output: "任务已暂停"
    
  "/resume":
    action: "resume_task"
    description: "恢复暂停的任务"
    usage: "/resume {task_id}"
    example: "/resume task_20250115_003"
    output: "任务已恢复"
    
  "/cancel":
    action: "cancel_task"
    description: "取消任务"
    usage: "/cancel {task_id}"
    example: "/cancel task_20250115_003"
    output: "任务已取消"

  # 预研类快捷指令
  
  "/research":
    template: "deep_research"
    description: "深度预研某个方向"
    usage: "/research 主题：{topic}，深度：{depth}"
    example: "/research 主题：AI Agent发展趋势，深度：深度预研"
    priority: "normal"
    
  "/knowledge":
    template: "knowledge_collection"
    description: "快速搜集知识"
    usage: "/knowledge 主题：{topic}，来源：{sources}"
    example: "/knowledge 主题：量子计算，来源：Hacker News, Medium"
    priority: "normal"
    
  "/tech":
    template: "tech_research"
    description: "技术预研"
    usage: "/tech 技术：{tech_name}，场景：{context}"
    example: "/tech 技术：Rust语言，场景：后端开发"
    priority: "normal"
    
  "/trend":
    template: "trend_research"
    description: "行业趋势预研"
    usage: "/trend 行业：{industry}，时间：{time_range}"
    example: "/trend 行业：AI，时间：2025年"
    priority: "normal"
    
  "/competitor":
    template: "competitor_research"
    description: "竞品分析"
    usage: "/competitor 产品：{product_type}"
    example: "/competitor 产品：AI写作工具"
    priority: "normal"
    
  "/learning":
    template: "learning_path"
    description: "学习路径规划"
    usage: "/learning 领域：{field}，当前：{current}，目标：{target}"
    example: "/learning 领域：AI Agent开发，当前：初级，目标：高级"
    priority: "normal"
  
  # 定时任务快捷指令
  
  "/schedule":
    action: "schedule_task"
    description: "创建定时任务"
    usage: "/schedule {指令} 时间：{time}"
    example: "/schedule /xhs 时间：20:30（今晚）"
    
  "/schedule_list":
    action: "list_scheduled_tasks"
    description: "查看所有定时任务"
    usage: "/schedule_list"
    
  "/schedule_cancel":
    action: "cancel_scheduled_task"
    description: "取消定时任务"
    usage: "/schedule_cancel {task_id}"
    
  # 批量任务快捷指令
  
  "/batch":
    action: "batch_tasks"
    description: "批量执行多个任务"
    usage: "/batch {任务列表}"
    example: "/batch /xhs 主题：AI, /ins topic: Tech"
    
  "/batch_confirm":
    action: "batch_confirm"
    description: "批量确认所有待确认任务"
    usage: "/batch_confirm"
  
  # 任务模板管理快捷指令
  
  "/create_template":
    action: "create_template"
    description: "创建新任务模板"
    usage: "/create_template {模板名} {描述}"
    example: "/create_template video_creation 视频内容创作"
    
  "/template":
    action: "show_template"
    description: "查看任务模板详情"
    usage: "/template {模板名}"
    example: "/template xiaohongshu_post"
    
  "/list_templates":
    action: "list_templates"
    description: "查看所有任务模板"
    usage: "/list_templates"
  
  # 指令管理快捷指令
  
  "/add_command":
    action: "add_command"
    description: "添加新指令"
    usage: "/add_command {指令名} {模板名} {描述}"
    example: "/add_command /video video_creation 视频内容创作"
    
  "/modify_command":
    action: "modify_command"
    description: "修改现有指令"
    usage: "/modify_command {指令名} {修改内容}"
    example: "/modify_command /xhs priority=high"
    
  "/delete_command":
    action: "delete_command"
    description: "删除指令"
    usage: "/delete_command {指令名}"
    example: "/delete_command /video"
    
  "/list_commands":
    action: "list_commands"
    description: "查看所有可用指令"
    usage: "/list_commands"
  
  # 智能体管理快捷指令
  
  "/check_agent":
    action: "check_agent_status"
    description: "检查智能体状态"
    usage: "/check_agent {agent_id}"
    example: "/check_agent mobile_claw"
    
  "/restart_agent":
    action: "restart_agent"
    description: "重启智能体"
    usage: "/restart_agent {agent_id}"
    example: "/restart_agent mobile_claw"
    
  "/agent_history":
    action: "agent_task_history"
    description: "查看智能体任务历史"
    usage: "/agent_history {agent_id}"
    example: "/agent_history mobile_claw"
  
  # 知识库管理快捷指令
  
  "/kb_add":
    action: "add_knowledge"
    description: "手动添加知识"
    usage: "/kb_add 类别：{category} 内容：{content}"
    example: "/kb_add 类别：lessons 内容：小红书发布时间应避开14:00"
    
  "/kb_search":
    action: "search_knowledge"
    description: "搜索知识库"
    usage: "/kb_search {关键词}"
    example: "/kb_search 小红书"
    
  "/kb_update":
    action: "update_knowledge"
    description: "更新知识库内容"
    usage: "/kb_update {knowledge_id} 内容：{new_content}"
    example: "/kb_update lesson_001 内容：小红书最佳发布时间为20:30-21:30"
    
  "/kb_delete":
    action: "delete_knowledge"
    description: "删除知识库内容"
    usage: "/kb_delete {knowledge_id}"
  
  # 任务管理补充快捷指令
  
  "/priority":
    action: "change_priority"
    description: "调整任务优先级"
    usage: "/priority {task_id} {priority}"
    example: "/priority task_001 urgent"
    
  "/depend":
    action: "set_dependency"
    description: "设置任务依赖关系"
    usage: "/depend {task_id} 依赖：{dependency_task_ids}"
    example: "/depend task_002 依赖：task_001"
    
  "/clone":
    action: "clone_task"
    description: "克隆历史任务"
    usage: "/clone {history_task_id}"
    example: "/clone task_20250110_003"
    
  "/history":
    action: "task_history"
    description: "查看历史任务"
    usage: "/history {task_id}"
    example: "/history task_20250110_003"
  
  # 统计分析快捷指令
  
  "/stats":
    action: "task_statistics"
    description: "统计分析任务数据"
    usage: "/stats {时间范围}"
    example: "/stats 本周"
    
  "/report":
    action: "generate_custom_report"
    description: "生成自定义报告"
    usage: "/report 类型：{type} 时间：{time_range}"
    example: "/report 类型：工作总结 时间：本周"
  
  # 提醒设置快捷指令
  
  "/remind":
    action: "set_reminder"
    description: "设置提醒"
    usage: "/remind 时间：{time} 内容：{content}"
    example: "/remind 时间：18:00 内容：查看今日汇总"
    
  "/remind_list":
    action: "list_reminders"
    description: "查看所有提醒"
    usage: "/remind_list"
    
  "/remind_cancel":
    action: "cancel_reminder"
    description: "取消提醒"
    usage: "/remind_cancel {remind_id}"
  
  # 工作流可视化快捷指令
  
  "/workflow":
    action: "show_workflow"
    description: "查看任务工作流图"
    usage: "/workflow {task_id}"
    example: "/workflow task_001"
  
  # 任务测试快捷指令
  
  "/test_template":
    action: "test_template"
    description: "测试任务模板"
    usage: "/test_template {模板名}"
    example: "/test_template xiaohongshu_post"

