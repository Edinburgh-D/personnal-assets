<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Knowledge Bases</title>
  <style>
    :root { --bg:#f5f5f7; --panel:#fff; --text:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.1); --blue:#2563eb; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(180deg,#fff,var(--bg)); color:var(--text); }
    main { max-width:1080px; margin:0 auto; padding:56px 20px; }
    header { margin-bottom:28px; }
    h1 { margin:0 0 10px; font-size:clamp(34px,6vw,64px); line-height:1; letter-spacing:-.02em; }
    p { margin:0; color:var(--muted); line-height:1.7; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:28px; }
    .card { display:block; min-height:150px; padding:22px; border:1px solid var(--line); border-radius:22px; background:rgba(255,255,255,.82); color:inherit; text-decoration:none; box-shadow:0 18px 50px rgba(24,30,44,.08); transition:transform .18s, box-shadow .18s; }
    .card:hover { transform:translateY(-2px); box-shadow:0 22px 58px rgba(24,30,44,.12); }
    .card.disabled { opacity:.55; }
    .card span { display:inline-flex; margin-bottom:22px; padding:6px 10px; border-radius:999px; background:#edf4ff; color:var(--blue); font-size:12px; font-weight:700; }
    .card strong { display:block; margin-bottom:10px; font-size:20px; }
    .card small { color:var(--muted); }
    .secondary { margin-top:24px; }
    .secondary a { color:var(--blue); text-decoration:none; font-weight:700; }
  </style>
</head>
